[package]
name = "aura-core"
description = "Aura configuration language: deterministic, capability-secured, schema-validated configs"
keywords = ["configuration", "config", "language", "deterministic", "yaml"]
categories = ["config", "parser-implementations"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "eval"
harness = false
