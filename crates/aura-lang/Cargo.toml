[package]
name = "aura-lang"
description = "Aura configuration language: deterministic, capability-secured, schema-validated configs — embeddable library + the `aura` CLI"
keywords = ["configuration", "config", "language", "deterministic", "cli"]
categories = ["config", "parser-implementations", "command-line-utilities"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "aura"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The `aura` binary. Kept optional so the library stays pure Rust (no
# clap/ariadne/ureq) and cross-compiles to wasm32/etc. — `--no-default-features`
# checks the embeddable library alone.
cli = ["dep:ariadne", "dep:clap", "dep:ureq"]

[dependencies]
# Library (always)
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
yaml-rust2 = "0.11"
sha2 = "0.11"
toml = "1"
# CLI-only (behind the `cli` feature)
ariadne = { version = "0.6", optional = true }
clap = { version = "4", features = ["derive", "string"], optional = true }
ureq = { version = "3", optional = true }

[dev-dependencies]
criterion = "0.8"
proptest = "1"

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "resolve"
harness = false
