[workspace]

[package]
name = "aura-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for the Aura configuration language"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The core without the CLI: no clap, no ariadne, no network.
aura-lang = { path = "../aura-lang", default-features = false }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
