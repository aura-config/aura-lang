[workspace]
members = ["crates/aura-lang", "crates/aura-lsp"]
# aura-wasm keeps its own workspace so its size-tuned release profile
# (opt-level "z", LTO, panic=abort) actually applies — profiles in a non-root
# package are ignored — and so `cargo test --workspace` need not build it.
exclude = ["examples", "fuzz", "crates/aura-wasm"]
resolver = "2"

# `aura-lsp` depends on `aura-lang`. A path-only dependency cannot be published
# ("all dependencies must have a version requirement"), and the version must
# travel with the workspace one, so it lives here rather than in the member.
[workspace.dependencies]
aura-lang = { path = "crates/aura-lang", version = "0.1.0", default-features = false }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aura-config/aura-lang"
homepage = "https://github.com/aura-config/aura-lang"
authors = ["Ilya Brin", "Aura contributors"]

# Release binaries carry no symbol table. The CLI's user-facing errors are
# ariadne diagnostics, not panics, so the symbols only ever cost download size —
# measured at 5.02 MB against 4.08 MB stripped on x86_64 Linux. A panic still
# prints its message and location; only the backtrace loses names, and anyone
# chasing one builds from source anyway.
#
# Not set for aura-wasm, which has its own workspace and its own size-tuned
# profile: a profile in a non-root package is ignored.
[profile.release]
strip = true
