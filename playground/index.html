<!doctype html>
<html lang="en" data-theme="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura playground</title>
    <meta
      name="description"
      content="Run the Aura configuration language in your browser: schemas, assertions and capability-gated I/O, evaluated locally with WebAssembly."
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>◈</text></svg>"
    />
  </head>
  <body>
    <header>
      <div class="brand">Aura <span>playground</span></div>

      <label
        >Example
        <select id="example" aria-label="Load an example"></select>
      </label>

      <label title="Grant read_file(); without it, reads are denied (E0310)">
        <input type="checkbox" id="allow-read" />
        allow read_file
      </label>

      <label title="Variables env() can see, as NAME=value, comma separated">
        env
        <input type="text" id="env" value="APP_ENV=production" spellcheck="false" />
      </label>

      <button id="format" type="button" title="Canonical formatting (aura fmt)">
        Format
      </button>

      <button id="theme" type="button" aria-label="Switch colour theme">
        Theme
      </button>
    </header>

    <main>
      <section class="pane" aria-label="Editor">
        <div class="tabs" id="file-tabs" role="tablist"></div>
        <div class="editor">
          <div class="gutter" id="gutter" aria-hidden="true"></div>
          <pre id="highlight" aria-hidden="true"></pre>
          <textarea
            id="code"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            aria-label="Aura source"
          ></textarea>
        </div>
      </section>

      <div
        class="splitter"
        id="splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize the panes"
        tabindex="0"
      ></div>

      <section class="pane" aria-label="Output">
        <div class="tabs" role="tablist" id="format-tabs">
          <button class="tab" role="tab" data-format="json" aria-selected="true">
            JSON
          </button>
          <button class="tab" role="tab" data-format="yaml" aria-selected="false">
            YAML
          </button>
          <button class="tab" role="tab" data-format="toml" aria-selected="false">
            TOML
          </button>
        </div>
        <pre class="output" id="output" aria-live="polite">Loading…</pre>
      </section>
    </main>

    <div class="diagnostics" id="diagnostics" role="log"></div>
    <div class="status" id="status">Starting the WebAssembly module…</div>

    <!-- Reports a failure the module itself cannot: if app.js throws while
         loading, nothing inside it runs and the page would sit on "Loading…"
         with no explanation. -->
    <script>
      const report = (what) => {
        const status = document.getElementById("status");
        if (status) status.textContent = String(what);
        const output = document.getElementById("output");
        if (output && output.textContent === "Loading…") output.textContent = "";
      };
      if (location.protocol === "file:") {
        report(
          "Open this over http, not as a file: a browser refuses to load ES modules " +
            "and WebAssembly from file://. From this directory: python -m http.server 8787",
        );
      }
      addEventListener("error", (e) =>
        report(`Failed to start: ${e.message} (${e.filename}:${e.lineno})`),
      );
      addEventListener("unhandledrejection", (e) =>
        report(`Failed to start: ${e.reason}`),
      );
    </script>
    <script type="module" src="app.js"></script>
    <noscript>
      <p class="status">
        The playground evaluates Aura in your browser, so it needs JavaScript and
        WebAssembly. The language itself needs neither.
      </p>
    </noscript>
  </body>
</html>
