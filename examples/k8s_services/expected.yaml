staging:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: api
    namespace: staging
    labels:
      app: api
      tier: web
  spec:
    replicas: 3
    selector:
      matchLabels:
        app: api
        tier: web
    template:
      metadata:
        labels:
          app: api
          tier: web
      spec:
        containers:
        - name: api
          image: ghcr.io/acme/api:2.4.1
          ports:
          - containerPort: 8080
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: web
    namespace: staging
    labels:
      app: web
      tier: web
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: web
        tier: web
    template:
      metadata:
        labels:
          app: web
          tier: web
      spec:
        containers:
        - name: web
          image: ghcr.io/acme/web:1.9.0
          ports:
          - containerPort: 3000
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: auth
    namespace: staging
    labels:
      app: auth
      tier: web
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: auth
        tier: web
    template:
      metadata:
        labels:
          app: auth
          tier: web
      spec:
        containers:
        - name: auth
          image: ghcr.io/acme/auth:3.0.2
          ports:
          - containerPort: 8080
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: mailer
    namespace: staging
    labels:
      app: mailer
      tier: worker
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: mailer
        tier: worker
    template:
      metadata:
        labels:
          app: mailer
          tier: worker
      spec:
        containers:
        - name: mailer
          image: ghcr.io/acme/mailer:0.7.2
          ports:
          - containerPort: 8080
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: billing
    namespace: staging
    labels:
      app: billing
      tier: worker
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: billing
        tier: worker
    template:
      metadata:
        labels:
          app: billing
          tier: worker
      spec:
        containers:
        - name: billing
          image: ghcr.io/acme/billing:1.2.0
          ports:
          - containerPort: 8080
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
- apiVersion: v1
  kind: Service
  metadata:
    name: api
    namespace: staging
  spec:
    selector:
      app: api
    ports:
    - port: 80
      targetPort: 8080
- apiVersion: v1
  kind: Service
  metadata:
    name: web
    namespace: staging
  spec:
    selector:
      app: web
    ports:
    - port: 80
      targetPort: 3000
- apiVersion: v1
  kind: Service
  metadata:
    name: auth
    namespace: staging
  spec:
    selector:
      app: auth
    ports:
    - port: 80
      targetPort: 8080
