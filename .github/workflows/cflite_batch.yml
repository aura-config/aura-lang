# ClusterFuzzLite batch: an hour a night across every target, keeping the corpus
# between runs. This is the fuzzing that actually goes deep; the per-PR run is
# only as good as the corpus this job leaves behind.
name: ClusterFuzzLite (nightly)
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions: read-all
jobs:
  fuzz:
    name: Batch fuzzing
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: batch
          sanitizer: address
