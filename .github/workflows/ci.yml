name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Юниты, интеграционные тесты и conformance-suite (examples/*/expected.*)
      - run: cargo test --workspace

  # Переносимость ядра: aura-core — чистый Rust без C-зависимостей,
  # cargo check ловит несовместимые зависимости и платформенные дыры.
  # CLI (ureq/rustls) проверяется нативными сборками в test-матрице.
  cross-check:
    name: Cross-check core (${{ matrix.target }})
    strategy:
      matrix:
        target:
          - x86_64-unknown-freebsd
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p aura-core --target ${{ matrix.target }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Догфуд: все .aura-файлы репозитория канонически отформатированы
      - name: aura fmt --check
        run: |
          cargo build -p aura-cli
          find examples -name '*.aura' -print0 | xargs -0 ./target/debug/aura fmt --check

  strict-gate:
    name: Reference manifest (--strict analysis is intentionally red-tested in conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p aura-cli
      # Эталонный манифест обязан вычисляться end-to-end
      - name: Evaluate reference manifest
        working-directory: examples
        env:
          APP_ENV: production
        run: |
          ../target/debug/aura eval production_deploy.aura \
            --allow-read=. --allow-env=APP_ENV --registry-dir=registry --frozen > /dev/null
