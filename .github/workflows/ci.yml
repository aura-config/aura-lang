name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Юниты, интеграционные тесты и conformance-suite (examples/*/expected.*)
      - run: cargo test --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  strict-gate:
    name: Reference manifest (--strict analysis is intentionally red-tested in conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p aura-cli
      # Эталонный манифест обязан вычисляться end-to-end
      - name: Evaluate reference manifest
        working-directory: examples
        env:
          APP_ENV: production
        run: |
          ../target/debug/aura eval production_deploy.aura \
            --allow-read=. --allow-env=APP_ENV --registry-dir=registry --frozen > /dev/null
