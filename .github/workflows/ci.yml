name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Юниты, интеграционные тесты и conformance-suite (examples/*/expected.*)
      - run: cargo test --workspace

  # Переносимость ядра: aura-lang — чистый Rust без C-зависимостей,
  # cargo check ловит несовместимые зависимости и платформенные дыры.
  # CLI (ureq/rustls) проверяется нативными сборками в test-матрице.
  cross-check:
    name: Cross-check core (${{ matrix.target }})
    strategy:
      matrix:
        target:
          - x86_64-unknown-freebsd
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p aura-lang --no-default-features --target ${{ matrix.target }}

  # Enforce the declared MSRV (Cargo.toml rust-version) for the published library,
  # so the promise cannot silently drift as new stdlib APIs are used.
  msrv:
    name: MSRV (aura-lang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 1.85 is the real floor: the indexmap dependency requires it (edition 2024).
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p aura-lang --no-default-features

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Догфуд: все .aura-файлы репозитория канонически отформатированы
      - name: aura fmt --check
        run: |
          cargo build -p aura-lang
          find examples -name '*.aura' -print0 | xargs -0 ./target/debug/aura fmt --check

  docs:
    name: Build docs book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - run: mdbook build docs/book
      # Деплой на GitHub Pages — после публикации репозитория

  strict-gate:
    name: Reference manifest (--strict analysis is intentionally red-tested in conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p aura-lang
      # Эталонный манифест обязан вычисляться end-to-end
      - name: Evaluate reference manifest
        working-directory: examples
        env:
          APP_ENV: production
        run: |
          ../target/debug/aura eval production_deploy.aura \
            --allow-read=. --allow-env=APP_ENV --registry-dir=registry --frozen > /dev/null

  # Coverage-guided fuzzing (nightly + libFuzzer). Non-blocking: a smoke run of
  # each target for a bounded time, seeded from examples/. See fuzz/README.md.
  fuzz:
    name: Fuzz (nightly, smoke)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: Smoke-run each target (60s)
        # LeakSanitizer stays on: the interpreter's env arena + Weak closures keep
        # evaluation leak-free (see eval::env, D9). A regression here is a real leak.
        run: |
          for t in fuzz_lexer fuzz_parser fuzz_pipeline fuzz_fmt fuzz_codegen; do
            cargo fuzz run "$t" -- -rss_limit_mb=1024 -timeout=10 -max_total_time=60
          done
