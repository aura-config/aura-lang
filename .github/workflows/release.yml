name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Защита от человеческой ошибки: тег обязан совпадать с версией из Cargo.toml
  verify:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # A prerelease suffix is allowed: v0.1.0-rc.1 matches Cargo.toml 0.1.0
          BASE_VERSION="${TAG_VERSION%%-*}"
          echo "Cargo.toml: $CARGO_VERSION, tag: $TAG_VERSION (base $BASE_VERSION)"
          test "$CARGO_VERSION" = "$BASE_VERSION"

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            native: true
          # Статический бинарник: Alpine и scratch-контейнеры
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            native: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            native: false
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false # arm64-раннер: Rosetta не гарантирована
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            native: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install aarch64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # Тесты уже прогнаны в CI на каждый push; здесь собирается сам бинарник
      # (фича `cli` включена по умолчанию — см. crates/aura-lang/Cargo.toml).
      - run: cargo build --release -p aura-lang --target ${{ matrix.target }}

      # Дым: бинарник должен запускаться и вычислять реальный манифест — только
      # там, где архитектура сборки совпадает с раннером.
      - name: Smoke test (unix)
        if: matrix.native && runner.os != 'Windows'
        run: |
          BIN="$PWD/target/${{ matrix.target }}/release/aura"
          "$BIN" --version
          cd examples/ci_matrix && "$BIN" eval ci_matrix.aura > /dev/null
      - name: Smoke test (windows)
        if: matrix.native && runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "$PWD/target/${{ matrix.target }}/release/aura.exe"
          & $bin --version
          Push-Location examples/ci_matrix
          & $bin eval ci_matrix.aura | Out-Null
          Pop-Location

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          NAME="aura-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/aura" "$NAME/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          # Integrity в духе aura.lock: setup-aura сверяет хеш после скачивания
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $name = "aura-$version-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aura.exe" $name
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          # LF only: Out-File would write CRLF and `sha256sum -c` would then look
          # for a filename ending in a carriage return
          [IO.File]::WriteAllText("$PWD/$name.zip.sha256", "$hash  $name.zip`n")

      # Also kept as a workflow artifact: the release above is a draft, which
      # cannot be downloaded anonymously, and the e2e job needs these files.
      - name: Keep the archives for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            aura-*.tar.gz
            aura-*.zip
          retention-days: 1

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            aura-*.tar.gz
            aura-*.zip
            aura-*.sha256

  # Runs the shipped artifact where a GitHub runner cannot: on an older libc than
  # the one it was built against, on a system with no toolchain, and — for
  # aarch64 — at all. Two of the six targets are cross-compiled with `native:
  # false`, so before this job existed they were published without a single
  # instruction of them ever having been executed.
  e2e-artifacts:
    name: e2e ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc floor. The build runs on ubuntu-latest, so nothing else notices
          # when a symbol newer than the user's distro creeps in.
          - name: "gnu on debian:12"
            target: x86_64-unknown-linux-gnu
            image: debian:12
            platform: linux/amd64
          - name: "gnu on ubuntu:22.04"
            target: x86_64-unknown-linux-gnu
            image: ubuntu:22.04
            platform: linux/amd64
          # Static: must run where there is no glibc at all.
          - name: "musl on alpine"
            target: x86_64-unknown-linux-musl
            image: alpine:3
            platform: linux/amd64
          # And on a distro the gnu build cannot serve. Measured 2026-07-28: the
          # gnu binary needs GLIBC_2.34 and dies on 20.04 before `main`, while
          # this one passes every check. That gap is why `setup-aura` installs
          # musl on Linux, so this row is the evidence for that decision.
          - name: "musl on ubuntu:20.04 (below the gnu floor)"
            target: x86_64-unknown-linux-musl
            image: ubuntu:20.04
            platform: linux/amd64
          # The first execution this binary has ever had.
          - name: "aarch64 under qemu"
            target: aarch64-unknown-linux-gnu
            image: debian:12
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
      - name: Enable arm64 emulation
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
      - name: Unpack
        run: |
          mkdir -p dist
          tar -xzf aura-*.tar.gz -C dist
          find dist -name aura -exec chmod +x {} +
      # The container gets nothing but the binary and the script: no package
      # manager use, no toolchain, no network. If it needs anything else, that is
      # the finding.
      - name: Run e2e in ${{ matrix.image }}
        run: |
          docker run --rm --platform ${{ matrix.platform }}             -v "$PWD:/w" -w /w ${{ matrix.image }}             sh packaging/e2e.sh "$(find dist -name aura | head -1)"

  # Проверяет релиз так, как его увидит потребитель: ставит `aura` из только что
  # загруженных ассетов через наш же экшен и запускает его.
  self-test:
    name: Install from release (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./packaging/setup-aura
        with:
          version: ${{ github.ref_name }}
      - name: Use the installed binary
        shell: bash
        run: |
          aura --version
          cd examples/nginx && aura eval nginx.aura > /dev/null
      # `eval > /dev/null` only proves it did not crash. This checks what the
      # documentation actually promises of it.
      - name: Drive the installed binary
        shell: bash
        run: sh packaging/e2e.sh "$(command -v aura)"
