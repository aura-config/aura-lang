name: Bug report
description: Something behaves differently from what the docs or the spec say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A manifest that reproduces the problem is worth more than a description
        of it — most Aura bugs are two lines of input away from being obvious.

        For a **capability escape** — an import doing I/O, a read outside
        `--allow-read` — please use private reporting instead: Security → Report
        a vulnerability. See [SECURITY.md](https://github.com/aura-config/aura-lang/blob/main/SECURITY.md).

  - type: textarea
    id: manifest
    attributes:
      label: A manifest that reproduces it
      description: The smallest one that still shows the problem. Several files if it needs imports.
      render: text
      placeholder: |
        # main.aura
        x = 1
        y: x + 1
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: The command you ran
      description: Including the flags — grants change behaviour, so they matter.
      placeholder: aura eval main.aura --allow-env=APP_ENV
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the output verbatim, diagnostics included.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: If the spec or the docs say otherwise, a link or a section number helps.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `aura --version`, or the commit if you built it yourself.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - The playground, in a browser
        - Other
    validations:
      required: true
